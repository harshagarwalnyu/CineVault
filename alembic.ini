# A generic, Python-based config file for Alembic.
# All values are of the form `name = value`, with lines starting with '#' as comments.

[alembic]
script_location = alembic

# Revision identifiers.
# Default to "base" for the first revision in a new database.
revision_environment = false
revision_environment_file = None

# A 'console_scripts' entry in setup.py can use this to get the Alembic
# configuration for use with the command line.
# Change to 'true' to use the main logging configuration for Alembic output.
# 'alembic -c alembic.ini revision --autogenerate -m "Initial migration"'
# 'alembic -c alembic.ini upgrade head'

# Logging configuration
# For production environments, consider external logging setup.
# Here, we'll keep it simple.

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers = console
qualname = sqlalchemy

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
formatter = generic
args = (sys.stderr,)

[formatter_generic]
format = %(levelname)-5s [%(name)s] %(message)s
datefmt = %H:%M:%S