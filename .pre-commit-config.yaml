repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  # Python — ruff (lint + format)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Python — type checking
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: ["backend"]

  # Python — tests (pre-push only)
  - repo: local
    hooks:
      - id: pytest
        name: pytest (unit + integration)
        entry: uv run pytest -m "unit or integration" --maxfail=3 -q
        language: system
        pass_filenames: false
        stages: [pre-push]

  # Frontend — lint
  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend lint
        entry: bash -c 'cd frontend && bun run lint'
        language: system
        pass_filenames: false
        files: ^frontend/

  # Frontend — typecheck + build (pre-push only)
  - repo: local
    hooks:
      - id: frontend-build
        name: frontend build
        entry: bash -c 'cd frontend && bun run build'
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-push]

  # Docker — validate compose
  - repo: local
    hooks:
      - id: docker-compose-validate
        name: docker-compose validate
        entry: docker compose config -q
        language: system
        files: docker-compose\.yml$
        pass_filenames: false
