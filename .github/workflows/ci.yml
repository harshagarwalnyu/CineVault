name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///data/movies_recommender.db
      REDIS_URL: redis://localhost:6379
      ELASTICSEARCH_URL: http://localhost:9200
      PHD_SECRET_KEY: ci-secret-key
      CORS_ALLOW_ORIGINS: http://localhost:3002
      AUTO_INIT_DB: false
      USE_MOCK_DATA: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check backend

      - name: Ruff format check
        run: uv run ruff format --check backend

      - name: Mypy
        run: uv run mypy backend

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    env:
      DATABASE_URL: sqlite:///data/movies_recommender.db
      REDIS_URL: redis://localhost:6379
      ELASTICSEARCH_URL: http://localhost:9200
      PHD_SECRET_KEY: ci-secret-key
      CORS_ALLOW_ORIGINS: http://localhost:3002
      AUTO_INIT_DB: false
      USE_MOCK_DATA: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev

      - name: Unit and integration tests
        run: uv run pytest -m "unit or integration" --cov=backend --cov-report=term-missing --maxfail=3

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose config -q
      - name: Build images
        run: docker compose build
